# Render.com Blueprint — deploys API + Postgres
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: freehub-api
    env: node
    region: frankfurt
    plan: free
    buildCommand: npm install
    startCommand: npm run server
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: freehub-db
          property: connectionString
      - key: MEILI_HOST
        value: ""   # leave empty to use Postgres search fallback
      - key: CORS_ORIGIN
        value: "*"  # tighten to your frontend URL in production
      - key: JWT_SECRET
        generateValue: true
      - key: GITHUB_TOKEN
        sync: false
      - key: STEAM_API_KEY
        sync: false
      - key: JAMENDO_CLIENT_ID
        sync: false
      - key: VIRUSTOTAL_API_KEY
        sync: false

databases:
  - name: freehub-db
    plan: free
    databaseName: freehub
    user: freehub
